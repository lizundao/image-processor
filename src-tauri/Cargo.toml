[package]
name = "image-processor"
version = "1.0.0"
description = "离线桌面端批量图片处理工具"
authors = ["inkdot"]
license = "MIT"
homepage = "https://inkdot.cn"
edition = "2021"

[lib]
name = "image_processor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = ["codegen"] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.24"
imageproc = "0.23"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusttype = "0.9"
fontdb = "0.16"
gif = "0.13.3"
webp = "0.2"
png = "0.17"

[features]
# 生产构建 / frontendDist 指向文件系统时必须启用
# DO NOT REMOVE!!
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# 开发模式优化配置
[profile.dev]
opt-level = 1          # 轻微优化，提高运行速度
debug = true           # 保留调试信息
split-debuginfo = "unpacked"  # 加速链接
incremental = true     # 启用增量编译

# 依赖优化配置
[profile.dev.package."*"]
opt-level = 3          # 对依赖进行完全优化
debug = false          # 依赖不需要调试信息
