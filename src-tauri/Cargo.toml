[package]
name = "image-processor"
version = "1.0.0"
description = "A powerful desktop image processing application built with Tauri + Rust"
authors = ["lizundao <277059707@qq.com>"]
license = "MIT"
repository = "https://github.com/lizundao/image-processing"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "window-set-size", "window-set-max-size", "fs-write-file", "fs-read-file", "window-set-resizable", "fs-read-dir", "fs-copy-file", "fs-remove-dir", "window-set-focus", "fs-create-dir", "dialog-message", "dialog-save", "protocol-asset", "dialog-open", "fs-remove-file", "fs-exists", "fs-rename-file", "window-set-title", "window-set-min-size", "path-all", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.24"
imageproc = "0.23"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusttype = "0.9"
fontdb = "0.16"
gif = "0.13.3"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# 开发模式优化配置
[profile.dev]
opt-level = 1          # 轻微优化，提高运行速度
debug = true           # 保留调试信息
split-debuginfo = "unpacked"  # 加速链接
incremental = true     # 启用增量编译

# 依赖优化配置
[profile.dev.package."*"]
opt-level = 3          # 对依赖进行完全优化
debug = false          # 依赖不需要调试信息
